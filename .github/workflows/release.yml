name: Release to Google Play

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.0 && git push --tags → internal track
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to release to"
        type: choice
        default: production
        options: [internal, beta, production, promote]

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - run: bundle install

      - name: Decode signing keystore & Play credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_JSON_KEY_BASE64: ${{ secrets.PLAY_JSON_KEY_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "$PLAY_JSON_KEY_BASE64" | base64 -d > fastlane/play-store-key.json
          cat > keystore.properties <<PROPS
          storeFile=$GITHUB_WORKSPACE/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Run fastlane (${{ inputs.track || 'internal' }})
        run: bundle exec fastlane android ${{ inputs.track || 'internal' }}

      - name: Upload .aab artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
